name: Build TWRP for Galaxy A24

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: workspace/device/samsung/a24

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    - name: Set up Environment & Build
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses5

        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

        cd workspace
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4

        # Crear fix_python.py automáticamente
        cat << 'EOF' > ../fix_python.py
        import os, re
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.py'):
                    path = os.path.join(root, file)
                    try:
                        with open(path, 'r', encoding='latin1') as f:
                            content = f.read()
                        content = content.replace('.iteritems()', '.items()')
                        content = re.sub(r'\bprint\s+([^\(\n].*?)$', r'print(\1)', content, flags=re.MULTILINE)
                        with open(path, 'w', encoding='latin1') as f:
                            f.write(content)
                    except Exception:
                        pass
        EOF

        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export SELINUX_IGNORE_NEVERALLOWS=true
        export WITHOUT_STRIP=true

        # Variables para la pantalla y tema de TWRP
        export TW_THEME=portrait_hdpi
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2340

        python3 ../fix_python.py
        echo -e "#!/bin/sh\nexit 0" > build/make/tools/check_radio_versions.py

        lunch omni_a24-eng || lunch twrp_a24-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: recovery-a24
        path: workspace/out/target/product/a24/recovery.img
