name: Build TWRP for Galaxy A24

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    - name: Set up Environment & Sync Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses5

        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

        mkdir workspace
        cd workspace
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4

    - name: Checkout Device Tree into Workspace
      uses: actions/checkout@v4
      with:
        path: workspace/device/samsung/a24

    - name: Fix Python & Build
      run: |
        cd workspace

        # Reemplazar referencias a vendor/omni por vendor/twrp en el device tree
        find device/samsung/a24/ -type f \( -name "*.mk" -o -name "Android.bp" \) -exec sed -i 's|vendor/omni|vendor/twrp|g' {} +

        # Asegurar que dtbo.img y dtb.img estén en prebuilt
        mkdir -p device/samsung/a24/prebuilt
        [ -f device/samsung/a24/dtbo.img ] && cp device/samsung/a24/dtbo.img device/samsung/a24/prebuilt/
        [ -f device/samsung/a24/dtb.img ] && cp device/samsung/a24/dtb.img device/samsung/a24/prebuilt/

        # Descomentar y asegurar la línea de TARGET_PREBUILT_DTB en BoardConfig.mk
        board_config=$(find device/samsung/a24 -name "BoardConfig.mk" | head -n 1)
        if [ -n "$board_config" ]; then
            sed -i 's|#\s*TARGET_PREBUILT_DTB\s*:=|TARGET_PREBUILT_DTB :=|g' "$board_config"
        fi

        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export SELINUX_IGNORE_NEVERALLOWS=true
        export WITHOUT_STRIP=true

        # Variables para la pantalla y tema de TWRP
        export TW_THEME=portrait_hdpi
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2340

        echo -e "#!/bin/sh\nexit 0" > build/make/tools/check_radio_versions.py

        lunch omni_a24-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: recovery-a24
        path: workspace/out/target/product/a24/recovery.img
